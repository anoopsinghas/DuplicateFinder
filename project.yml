name: DuplicateFinder
options:
  bundleIdPrefix: com.singhanoop
  deploymentTarget:
    macOS: "14.0"
    iOS: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  xcodeVersion: "16.0"

packages:
  DuplicateFinderCore:
    path: .

settings:
  base:
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    # Personal-signing friendly defaults; user will pick their own team in Xcode.
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

targets:
  DuplicateFinderMac:
    type: application
    platform: macOS
    sources:
      - path: Sources/DuplicateFinderMac
    dependencies:
      - package: DuplicateFinderCore
        product: DuplicateFinderCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.singhanoop.duplicatefinder
        PRODUCT_NAME: DuplicateFinder
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        INFOPLIST_KEY_CFBundleDisplayName: DuplicateFinder
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.utilities"
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        GENERATE_INFOPLIST_FILE: YES
        # No sandbox in v1 — matches the plan; requires user to grant Full Disk Access manually.
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES

  DuplicateFinderiOS:
    type: application
    platform: iOS
    sources:
      - path: Sources/DuplicateFinderiOS
        excludes:
          - "Resources/Info.plist"
      - path: Sources/DuplicateFinderiOS/Resources/Info.plist
        buildPhase: none
    dependencies:
      - package: DuplicateFinderCore
        product: DuplicateFinderCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.singhanoop.duplicatefinder.ios
        PRODUCT_NAME: DuplicateFinder
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        TARGETED_DEVICE_FAMILY: "1,2"  # 1=iPhone, 2=iPad
        INFOPLIST_FILE: Sources/DuplicateFinderiOS/Resources/Info.plist
        SWIFT_EMIT_LOC_STRINGS: YES
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
